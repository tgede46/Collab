name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, devops]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: docker.io
  IMAGE_NAME: collab-app

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          echo "📦 Testing Docker image build..."
          docker images | grep collab-app
          echo "✅ Docker image built successfully!"

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/collab
          SPRING_DATASOURCE_USERNAME=postgres
          SPRING_DATASOURCE_PASSWORD=postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          EOF

      - name: Build and start services with Docker Compose
        run: |
          echo "🚀 Starting services with Docker Compose..."
          docker compose up -d --build
          echo "Services starting..."

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Waiting for services to start..."
          echo "Waiting for PostgreSQL..."
          sleep 20
          docker compose exec -T postgres pg_isready -U postgres || echo "PostgreSQL not ready yet"
          echo "Waiting for application..."
          sleep 40

      - name: Check services status
        run: |
          echo "📊 Services status:"
          docker compose ps
          echo ""
          echo "📋 Application logs:"
          docker compose logs --tail=50 app

      - name: Test application health
        run: |
          echo "🏥 Testing application health..."
          curl -f http://localhost:8080/actuator/health || echo "⚠️  Health check endpoint not available (actuator may not be configured)"
          echo ""
          echo "✅ Application is running on port 8080"

      - name: Stop services
        if: always()
        run: docker compose down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, docker-compose-test]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          # Add your staging deployment commands here
          # Example: ssh to server, pull image, restart services

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, docker-compose-test, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          # Add your production deployment commands here

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, docker-compose-test]
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "✅ Pipeline completed!"
          echo "Status: ${{ job.status }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          # Add Slack/Discord/Email notification here if needed
